[project]
name = "slot-api"
version = "0.1.0"
description = "Clinic API that lets patients book appointment slot"
readme = "README.md"
authors = [
    { name = "Nehemiah", email = "danielnehemiah15@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "gunicorn>=26.2.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
]

[project.scripts]
slot-api = "slot_api:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["B008"]  # FastAPI Depends() in default args is intentional

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
