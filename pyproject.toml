[project]
name = "slot-api"
version = "0.1.0"
description = "Clinic API that lets patients book appointment slot"
readme = "README.md"
authors = [
    { name = "Nehemiah", email = "danielnehemiah15@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "gunicorn>=26.2.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
slot-api = "slot_api:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
